version: '3.8'

services:
  app:
    build: .
    container_name: crawler-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_NAME=CrawlerDB
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - db
      - redis
    networks:
      - crawler-network

  db:
    image: postgres:15
    container_name: crawler-db
    environment:
      POSTGRES_DB: CrawlerDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crawler-network

  redis:
    image: redis:alpine
    container_name: crawler-redis
    ports:
      - "6379:6379"
    networks:
      - crawler-network

volumes:
  postgres_data:

networks:
  crawler-network: